<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GATE CSE Mock Hall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an exam hall. A CBT-style top strip, a shelf of papers by year (with the organising institute), and an exam console with question pane + answer palette. Light only, by request. */
:root{
  --bg:#f6f8fb; --paper:#ffffff; --ink:#18212f; --ink2:#4a5568; --line:#dde3ec; --soft:#eef2f8;
  --accent:#1d4ea3; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --ok:#1f8a4c; --ok-soft:#e2f4ea; --bad:#c2372f; --bad-soft:#fbe6e4; --warn:#b26a00; --warn-soft:#fff1d9;
  --mark:#6b3fa0; --mark-soft:#efe7f8; --nv:#c9d1dc;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.muted{color:var(--ink2)}
/* top strip */
.strip{background:var(--accent);color:var(--accent-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.strip .wrap{display:flex;align-items:center;gap:16px;min-height:52px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-family:var(--f-body);font-size:12px;opacity:.8;font-weight:400;margin-left:8px}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.nav button{background:transparent;border:0;color:var(--accent-ink);padding:8px 12px;border-radius:6px;opacity:.85;font-weight:500;font-size:14px}
.nav button[aria-current="true"]{background:rgba(255,255,255,.18);opacity:1}
.nav button:hover{opacity:1}
main{padding-block:24px 64px}
.view{display:grid;gap:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:7px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px}
.lead{max-width:68ch;color:var(--ink2);margin:6px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
label.field{display:grid;gap:4px;font-size:13px;color:var(--ink2)}
select,input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end}
.hero h1{font-size:clamp(30px,4.4vw,46px);line-height:1.08}
.pattern{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pattern div{background:var(--paper);padding:12px 14px}
.pattern b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.pattern span{font-size:12px;color:var(--ink2)}
/* shelf */
.shelf{display:grid;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.yr{font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.org{font-weight:600}
.sets{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.setcard{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 10px;background:var(--soft)}
.setcard .lbl{font-size:13px;font-weight:600;min-width:42px}
.best{font-size:12px;color:var(--ink2)}
/* mixed */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.formgrid{display:flex;gap:14px;flex-wrap:wrap;align-items:end}
.blueprint{width:100%;border-collapse:collapse;font-size:14px}
.blueprint td,.blueprint th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.blueprint th{font-size:12px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.blueprint td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.exhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.timer{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.qpane{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--soft);font-size:13px}
.qbar .qn{font-weight:600;font-size:15px}
.tag{display:inline-block;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:600;background:var(--paper);border:1px solid var(--line)}
.tag.neg{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.tag.pos{color:var(--ok);border-color:var(--ok-soft);background:var(--ok-soft)}
.qimg{padding:14px 16px;overflow-x:auto}
.qimg img{display:block;max-width:100%;height:auto;margin:0;min-height:40px;cursor:zoom-in}
.qimg img.zoom{max-width:none;width:200%;cursor:zoom-out}
@media (min-width:901px){.qimg img.zoom{width:auto}}
.ans{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{width:56px;height:44px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);font-weight:600;font-size:16px}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrongsel{background:var(--bad);border-color:var(--bad);color:#fff}
.natin{font-family:var(--f-mono);font-size:18px;width:220px;max-width:100%}
.keypad{display:grid;grid-template-columns:repeat(6,44px);gap:6px}
.keypad button{height:36px;border:1px solid var(--line);border-radius:6px;background:var(--soft);font-family:var(--f-mono)}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--soft)}
.actions .sp{flex:1}
.side{display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pb{height:36px;border-radius:6px;border:1px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-size:13px;position:relative}
.pb.st-na{background:var(--bad);color:#fff;border-color:var(--bad);border-radius:6px 6px 14px 14px}
.pb.st-ans{background:var(--ok);color:#fff;border-color:var(--ok);border-radius:14px 14px 6px 6px}
.pb.st-mr{background:var(--mark);color:#fff;border-color:var(--mark);border-radius:50%}
.pb.st-amr{background:var(--mark);color:#fff;border-color:var(--mark);border-radius:50%}
.pb.st-amr::after{content:"";position:absolute;right:1px;bottom:1px;width:9px;height:9px;border-radius:50%;background:var(--ok);border:1.5px solid #fff}
.pb.cur{outline:2.5px solid var(--ink);outline-offset:1px}
.pb.r-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pb.r-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.secttl{font-size:12px;font-weight:600;color:var(--ink2);margin:4px 0}
.palhost{max-height:52vh;overflow:auto;display:grid;gap:8px;padding-right:2px}
.feedback{border-radius:8px;padding:10px 12px;font-size:14px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.na{background:var(--soft);color:var(--ink2)}
.explain{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--soft);font-size:14.5px;white-space:pre-wrap;line-height:1.6;max-width:80ch}
.explain b{color:var(--ink)}
/* confirm sheet */
.sheet{position:fixed;inset:0;background:rgba(24,33,47,.45);display:grid;place-items:center;z-index:30;padding:16px}
.sheet .panel{max-width:440px;width:100%;display:grid;gap:14px}
/* results */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.score div{background:var(--paper);padding:14px 16px}
.score b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.score span{font-size:12px;color:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:11.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.na{background:var(--soft);color:var(--ink2)}
.notes{display:grid;gap:8px;margin:0;padding-left:20px}
.revitem{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.revhead{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--soft);font-size:13.5px}
.revbody{padding:14px 16px;display:grid;gap:12px}
.kv{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.kv b{font-family:var(--f-mono)}
/* weightage */
.heat td.c{font-family:var(--f-mono);text-align:center;font-variant-numeric:tabular-nums;min-width:44px}
.hbar{display:grid;grid-template-columns:200px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:14px}
.hbar .t{height:14px;border-radius:3px;background:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;z-index:40}
.palbtn{display:none}
@media (max-width:900px){
  .hero,.two{grid-template-columns:minmax(0,1fr)}
  .exam{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .palbtn{display:inline-flex}
  .side.closed .palwrap{display:none!important}
}
@media (max-width:620px){
  .row{grid-template-columns:minmax(0,1fr);gap:8px}
  .sets{justify-content:flex-start}
  .hbar{grid-template-columns:120px minmax(0,1fr) 48px}
  .brand small{display:none}
  .pattern b{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</div></header>
<main class="wrap" id="app"></main>

<script>
"use strict";
const D=JSON.parse(document.getElementById('data').textContent);
const SUB={GA:'General Aptitude',EM:'Engineering Mathematics',DM:'Discrete Mathematics',DL:'Digital Logic',CO:'Computer Org. & Architecture',PD:'Programming & Data Structures',AL:'Algorithms',TC:'Theory of Computation',CD:'Compiler Design',OS:'Operating Systems',DB:'Databases',CN:'Computer Networks',OT:'Old syllabus (removed)'};
const SUBORD=['GA','EM','DM','DL','CO','PD','AL','TC','CD','OS','DB','CN','OT'];
const QM={}; D.q.forEach(q=>QM[q.i]=q);
const PM={}; D.papers.forEach(p=>PM[p.p]=p);
const paperName=p=>{const P=PM[p];return `GATE ${P.y}${P.s?' Set '+P.s:''}`};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('gmh_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('gmh_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('gmh_'+k)}catch(e){}}};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const fmtT=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
const r2=x=>Math.round(x*100)/100;
const fmtM=x=>{x=r2(x);return (Number.isInteger(x)?x:x.toFixed(2))};

/* ---------- answer checking ---------- */
function isMTA(q){return /MTA/.test(q.k)}
function check(q,a){ // returns {st:'c'|'w'|'u', m}
  if(isMTA(q)) return {st:'c',m:q.m,mta:true};
  if(a==null||a==='') return {st:'u',m:0};
  const alts=q.k.split(/\s+OR\s+/i).map(s=>s.trim());
  let ok=false;
  if(q.t==='MCQ') ok=alts.includes(a);
  else if(q.t==='MSQ') ok=alts.some(k=>k.replace(/[^A-D]/g,'').split('').sort().join('')===a);
  else { const v=parseFloat(a); if(!isNaN(v)) ok=alts.some(k=>{const m=k.match(/(-?[\d.]+)\s*to\s*(-?[\d.]+)/i); if(!m) return false; const lo=Math.min(+m[1],+m[2]),hi=Math.max(+m[1],+m[2]); return v>=lo-1e-9&&v<=hi+1e-9}); }
  if(ok) return {st:'c',m:q.m};
  return {st:'w',m:q.t==='MCQ'?-q.m/3:0};
}
function keyText(q){
  if(isMTA(q)) return 'Marks to all';
  return q.k.split(/\s+OR\s+/i).map(k=>{
    if(q.t==='NAT'){const m=k.match(/(-?[\d.]+)\s*to\s*(-?[\d.]+)/i); if(m) return m[1]===m[2]?m[1]:`${m[1]} to ${m[2]}`; return k}
    return k.replace(/;/g,', ');
  }).join(' or ');
}
const respText=(q,a)=>a==null||a===''?'Not attempted':(q.t==='MSQ'?a.split('').join(', '):a);
const typeName={MCQ:'MCQ',MSQ:'MSQ',NAT:'NAT'};

/* ---------- state & routing ---------- */
let view='papers', ex=null, tick=null, resultCtx=null;
function go(v){view=v; if(v!=='exam'){stopTick()} render(); window.scrollTo(0,0)}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return; if(ex&&!ex.done&&view==='exam'){autoSave();saveEx()} go(b.dataset.v)});
function setNav(){document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.v===view||(view==='exam'&&false))))}

/* ---------- paper shelf ---------- */
function bestFor(p){const h=LS.get('hist',[]).filter(x=>x.paper===p&&x.kind==='year');if(!h.length)return null;return Math.max(...h.map(x=>x.score))}
function viewPapers(){
  const years=[...new Set(D.papers.map(p=>p.y))].sort((a,b)=>b-a);
  const active=LS.get('active',null);
  return `<section class="hero">
    <div><div class="eyebrow">GATE Computer Science &amp; IT · 20 official papers</div>
    <h1>Sit every GATE CSE paper from 2015 to 2026, exactly as it was set.</h1>
    <p class="lead">Each question is the original image from the official paper, scored with the official answer key, with negative marking. Take full 3-hour mocks year by year, build fresh mixed mocks in the current pattern, or practise by subject.</p></div>
    <div class="pattern" aria-label="Current GATE CSE pattern">
      <div><b>65</b><span>questions</span></div><div><b>100</b><span>marks</span></div><div><b>180</b><span>minutes</span></div>
      <div><b>15</b><span>GA (5×1 + 5×2)</span></div><div><b>72</b><span>CS core</span></div><div><b>13</b><span>Engg. Maths</span></div>
    </div>
  </section>
  ${active&&!active.done?`<div class="panel" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between"><div><div class="eyebrow">Unfinished test</div><div style="font-weight:600">${esc(active.title)}</div><div class="muted" style="font-size:13px">${active.kind==='practice'?'Practice':'Time left '+fmtT(active.dur-active.elapsed)}</div></div><div style="display:flex;gap:8px"><button class="btn" id="discard">Discard</button><button class="btn primary" id="resume">Resume</button></div></div>`:''}
  <section style="display:grid;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap"><h2 style="font-size:26px">Year-wise papers</h2><span class="muted" style="font-size:13px">Organising institute shown for each year · Mock = timed 180 min · Practice = untimed, check as you go</span></div>
    <div class="shelf">${years.map(y=>{const ps=D.papers.filter(p=>p.y===y);return `<div class="row">
      <div class="yr">${y}</div>
      <div style="min-width:0"><div class="org">${esc(ps[0].iit)}</div><div class="muted" style="font-size:13px">${ps.length>1?ps.length+' sets':'Single paper'} · 65 questions · 100 marks</div></div>
      <div class="sets">${ps.map(p=>{const b=bestFor(p.p);return `<div class="setcard"><span class="lbl">${p.s?'Set '+p.s:'Paper'}</span>${b!=null?`<span class="best num">best ${fmtM(b)}</span>`:''}<button class="btn small primary" data-mock="${p.p}">Mock</button><button class="btn small" data-prac="${p.p}">Practice</button></div>`}).join('')}</div>
    </div>`}).join('')}</div>
  </section>`;
}
function bindPapers(){
  document.querySelectorAll('[data-mock]').forEach(b=>b.onclick=()=>startYear(b.dataset.mock,'year'));
  document.querySelectorAll('[data-prac]').forEach(b=>b.onclick=()=>startYear(b.dataset.prac,'practice'));
  const r=$('#resume'); if(r) r.onclick=()=>{ex=LS.get('active');go('exam')};
  const d=$('#discard'); if(d) d.onclick=()=>{LS.del('active');render()};
}
function paperQs(p){return D.q.filter(q=>q.p===p)}
function newExam(o){return Object.assign({id:'x'+Date.now(),resp:{},cur:0,elapsed:0,done:false,checked:{},started:Date.now()},o)}
function confirmReplace(cb){
  const a=LS.get('active',null);
  if(a&&!a.done){sheet(`<h3 style="font-size:20px">Replace your unfinished test?</h3><p class="muted" style="margin:0">“${esc(a.title)}” is still in progress. Starting a new one discards it.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-x>Keep it</button><button class="btn primary" data-ok>Start new test</button></div>`,cb)} else cb();
}
function startYear(p,kind){
  confirmReplace(()=>{
    const qs=paperQs(p).map(q=>q.i);
    const P=PM[p];
    ex=newExam({kind,paper:p,title:`${paperName(p)} · ${P.iit}`+(kind==='practice'?' · Practice':''),qs,dur:kind==='practice'?0:10800});
    saveEx(); go('exam');
  });
}

/* ---------- mixed mock ---------- */
let mixOpt=LS.get('mixopt',{from:2015,to:2026,fresh:true});
function pool(o){return D.q.filter(q=>{const y=PM[q.p].y;return y>=o.from&&y<=o.to&&q.s!=='OT'&&!isMTA(q)})}
function avgShare(){ // average marks per subject across papers (CS only), used as weights
  const w={}; D.q.forEach(q=>{if(q.g)return; w[q.s]=(w[q.s]||0)+q.m}); return w;
}
function pickN(arr,n,seen,fresh){
  let a=shuffle(arr); if(fresh){a.sort((x,y)=>(seen[x.i]?1:0)-(seen[y.i]?1:0))} return a.slice(0,n);
}
function alloc(total,weights){ // largest remainder
  const ks=Object.keys(weights),W=ks.reduce((s,k)=>s+weights[k],0)||1;const raw=ks.map(k=>({k,v:total*weights[k]/W}));
  const out={};let used=0;raw.forEach(r=>{out[r.k]=Math.floor(r.v);used+=out[r.k]});
  raw.sort((a,b)=>(b.v-Math.floor(b.v))-(a.v-Math.floor(a.v)));for(let i=0;used<total;i++,used++)out[raw[i%raw.length].k]++;return out;
}
function buildMixed(o){
  const P=pool(o), seen=LS.get('seen',{}); const sel=[];
  const by=(f)=>P.filter(f);
  // GA: 5 x 1 + 5 x 2
  sel.push(...pickN(by(q=>q.g&&q.m===1),5,seen,o.fresh),...pickN(by(q=>q.g&&q.m===2),5,seen,o.fresh));
  // Maths 13 marks: 5 x 1 + 4 x 2, split EM/DM
  const m1=pickN(by(q=>!q.g&&(q.s==='EM'||q.s==='DM')&&q.m===1),5,seen,o.fresh);
  const m2=pickN(by(q=>!q.g&&(q.s==='EM'||q.s==='DM')&&q.m===2),4,seen,o.fresh);
  // Core 72 marks: 20 x 1 + 26 x 2, allocated by historical weight

function evaluate(rec){
  const resp=rec.resp; const items=rec.qs.map(id=>{const q=QM[id];const v=resp[id];const a=Array.isArray(v)?v[0]:(v&&v.a)||'';const t=Array.isArray(v)?v[1]:(v&&v.t)||0;const c=check(q,a);return {q,a,t,st:c.st,m:c.m}});

  return {items,score,max,c:items.filter(x=>x.st==='c').length,w:items.filter(x=>x.st==='w').length,u:items.filter(x=>x.st==='u').length};
}
function analyse(res){
  const by={};
  res.items.forEach(x=>{const s=x.q.s;const b=by[s]||(by[s]={s,n:0,att:0,c:0,w:0,got:0,max:0,neg:0,t:0});b.n++;b.max+=x.q.m;b.got+=x.m;b.t+=x.t;if(x.st!=='u'||x.a)b.att+=(x.a?1:0);if(x.st==='c'&&x.a)b.c++;if(x.st==='w')b.w++;if(x.m<0)b.neg+=-x.m});
  return SUBORD.filter(s=>by[s]).map(s=>by[s]);
}
function feedbackNotes(res,subs,rec){
  const N=[]; const neg=res.items.filter(x=>x.m<0).reduce((s,x)=>s-x.m,0);
  const att=res.items.filter(x=>x.a).length;
  const acc=att?res.c/att:0;
  if(att) N.push(`You attempted ${att} of ${res.items.length} questions with ${Math.round(acc*100)}% accuracy.`);
  if(neg>0) N.push(`Negative marking cost you ${fmtM(neg)} marks on ${res.items.filter(x=>x.m<0).length} wrong MCQs. Leaving those blank would have scored ${fmtM(res.score+neg)}.`);
  const missedNat=res.items.filter(x=>x.q.t!=='MCQ'&&!x.a).reduce((s,x)=>s+x.q.m,0);
  if(missedNat>=4) N.push(`You left ${fmtM(missedNat)} marks of MSQ/NAT questions blank. These have no negative marking, so an educated attempt costs nothing.`);
  const one=res.items.filter(x=>x.q.m===1),two=res.items.filter(x=>x.q.m===2);
  const accOf=a=>{const t=a.filter(x=>x.a);return t.length?Math.round(100*t.filter(x=>x.st==='c').length/t.length):null};
  const a1=accOf(one),a2=accOf(two); if(a1!=null&&a2!=null) N.push(`Accuracy on 1-mark questions ${a1}%, on 2-mark questions ${a2}%.`);
  const cs=subs.filter(s=>s.s!=='GA'&&s.n>=2);
  const weak=cs.filter(s=>s.att&&s.c/s.att<0.5).sort((a,b)=>(b.max-b.got)-(a.max-a.got)).slice(0,3);
  if(weak.length) N.push(`Weakest by accuracy: ${weak.map(s=>`${SUB[s.s]} (${s.c}/${s.att} correct)`).join(', ')}. Revise these first.`);
  const skip=cs.filter(s=>s.n>=3&&s.att/s.n<0.4).slice(0,3);
  if(skip.length) N.push(`Mostly skipped: ${skip.map(s=>`${SUB[s.s]} (${s.att}/${s.n} attempted)`).join(', ')}. Low attempt rates here usually mean the topic needs a first pass, not just practice.`);
  const strong=cs.filter(s=>s.att>=2&&s.c/s.att>=0.75).map(s=>SUB[s.s]);
  if(strong.length) N.push(`Strong areas: ${strong.join(', ')}.`);
  const ga=subs.find(s=>s.s==='GA'); if(ga&&ga.n>=5) N.push(`General Aptitude: ${fmtM(ga.got)} of ${ga.max}. GA is the cheapest 15 marks in the paper; aim for 12+.`);
  if(rec.dur){const used=rec.elapsed/60; N.push(`You used ${Math.round(used)} of ${Math.round(rec.dur/60)} minutes.`); const slow=res.items.filter(x=>x.t>360).length; if(slow) N.push(`${slow} question${slow>1?'s':''} took more than 6 minutes each. In the real exam, move on after about 4 minutes and come back.`)}
  return N;
}
function stPill(x){if(x.st==='c')return `<span class="pill ok">Correct</span>`;if(x.st==='w')return `<span class="pill bad">Wrong</span>`;return `<span class="pill na">Not attempted</span>`}
function viewResult(){
  const {rec}=resultCtx; const res=evaluate(rec); const subs=analyse(res); const notes=feedbackNotes(res,subs,rec);
  const att=res.items.filter(x=>x.a).length;
  const f=resultCtx.filter;
  const list=res.items.map((x,k)=>({...x,k})).filter(x=>f==='all'||(f==='wrong'&&x.st==='w')||(f==='un'&&x.st==='u')||(f==='right'&&x.st==='c')||(f.startsWith('s:')&&x.q.s===f.slice(2)));
  const maxSub=Math.max(...subs.map(s=>s.max));
  return `<section style="display:grid;gap:6px"><div class="eyebrow">${rec.kind==='practice'?'Practice analysis':'Result'} · ${new Date(rec.date).toLocaleString()}</div><h1 style="font-size:clamp(26px,3.6vw,36px)">${esc(rec.title)}</h1></section>
  <div class="score">
    <div><b>${fmtM(res.score)}<span style="font-size:15px;color:var(--ink2)"> / ${res.max}</span></b><span>Marks</span></div>
    <div><b style="color:var(--ok)">${res.c}</b><span>Correct</span></div>
    <div><b style="color:var(--bad)">${res.w}</b><span>Wrong</span></div>
    <div><b>${res.items.length-att}</b><span>Not attempted</span></div>
    <div><b>${att?Math.round(100*res.items.filter(x=>x.a&&x.st==='c').length/att):0}%</b><span>Accuracy</span></div>
    <div><b>${fmtT(rec.elapsed)}</b><span>Time used</span></div>
  </div>
  <section class="two">
    <div class="panel" style="display:grid;gap:10px;align-content:start"><h2 style="font-size:22px">Feedback</h2><ul class="notes">${notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>
    <div class="panel" style="display:grid;gap:10px;align-content:start"><h2 style="font-size:22px">Marks by type</h2>
      <div class="scroll"><table class="tbl"><thead><tr><th>Type</th><th class="n">Qs</th><th class="n">Correct</th><th class="n">Wrong</th><th class="n">Marks</th></tr></thead><tbody>
      ${['MCQ','MSQ','NAT'].map(t=>{const a=res.items.filter(x=>x.q.t===t);if(!a.length)return'';return `<tr><td>${t}</td><td class="n">${a.length}</td><td class="n">${a.filter(x=>x.st==='c'&&x.a).length}</td><td class="n">${a.filter(x=>x.st==='w').length}</td><td class="n">${fmtM(a.reduce((s,x)=>s+x.m,0))} / ${a.reduce((s,x)=>s+x.q.m,0)}</td></tr>`}).join('')}
      ${[1,2].map(m=>{const a=res.items.filter(x=>x.q.m===m);return `<tr><td>${m}-mark</td><td class="n">${a.length}</td><td class="n">${a.filter(x=>x.st==='c'&&x.a).length}</td><td class="n">${a.filter(x=>x.st==='w').length}</td><td class="n">${fmtM(a.reduce((s,x)=>s+x.m,0))} / ${a.reduce((s,x)=>s+x.q.m,0)}</td></tr>`}).join('')}
      </tbody></table></div></div>
  </section>
  <section class="panel" style="display:grid;gap:10px"><h2 style="font-size:22px">Subject-wise analysis</h2>
    <div class="scroll"><table class="tbl"><thead><tr><th>Subject</th><th class="n">Qs</th><th class="n">Attempted</th><th class="n">Correct</th><th class="n">Wrong</th><th class="n">Neg.</th><th class="n">Marks</th><th>Share of marks</th><th class="n">Avg time</th><th>Status</th><th></th></tr></thead><tbody>
    ${subs.map(s=>{const acc=s.att?s.c/s.att:0;const pill=!s.att?'<span class="pill na">Skipped</span>':acc>=.75?'<span class="pill ok">Strong</span>':acc>=.5?'<span class="pill warn">Average</span>':'<span class="pill bad">Weak</span>';
      return `<tr><td>${SUB[s.s]}</td><td class="n">${s.n}</td><td class="n">${s.att}</td><td class="n">${s.c}</td><td class="n">${s.w}</td><td class="n">${s.neg?'−'+fmtM(s.neg):'0'}</td><td class="n">${fmtM(s.got)} / ${s.max}</td><td><div class="bar" style="width:${Math.max(40,100*s.max/maxSub)}%"><i style="width:${Math.max(0,100*s.got/s.max)}%"></i></div></td><td class="n">${fmtT(s.t/s.n)}</td><td>${pill}</td><td><button class="btn small ghost" data-f="s:${s.s}">Review</button></td></tr>`}).join('')}
    </tbody></table></div></section>
  <section style="display:grid;gap:12px">
    <div style="display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap"><h2 style="font-size:24px">Question review</h2>
      <div class="chips" id="rf">${[['wrong','Wrong ('+res.w+')'],['un','Not attempted ('+(res.items.length-att)+')'],['right','Correct'],['all','All']].map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}${f.startsWith('s:')?`<button class="chip" aria-pressed="true">${SUB[f.slice(2)]}</button>`:''}</div></div>
    ${list.length?list.map(x=>reviewItem(x)).join(''):`<div class="panel empty">Nothing in this filter.</div>`}
  </section>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-goto="papers">Back to papers</button><button class="btn" data-goto="history">All attempts</button></div>`;
}
function reviewItem(x){
  const q=x.q;
  return `<article class="revitem" id="rv-${x.k}"><div class="revhead"><b>Q${x.k+1}</b>${stPill(x)}<span class="tag">${q.t}</span><span class="tag">${q.m} mark${q.m>1?'s':''}</span><span class="muted">${SUB[q.s]} · ${paperName(q.p)} ${esc(q.l)} · ${esc(PM[q.p].iit)}</span><span class="num muted" style="margin-left:auto">${x.m>0?'+':''}${fmtM(x.m)} · ${fmtT(x.t)}</span></div>
   <div class="revbody"><div class="qimg" style="padding:0"><img data-q="${q.i}" alt="${esc(paperName(q.p)+' '+q.l)}"></div>
   <div class="kv"><span>Your answer: <b style="color:${x.st==='c'?'var(--ok)':x.st==='w'?'var(--bad)':'var(--ink2)'}">${esc(respText(q,x.a))}</b></span><span>Correct answer: <b style="color:var(--ok)">${esc(keyText(q))}</b></span></div>
   ${explainBlock(q,x.a)}</div></article>`;
}
function bindResult(){
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{resultCtx.filter=b.dataset.f;render(true);const h=$('#rf');h&&h.scrollIntoView({block:'start'})});
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));
  bindExplain();
}

/* ---------- Claude explanations ---------- */
let sampler; const sampleP=(window.claude&&window.claude.use)?window.claude.use('sample').then(s=>{sampler=s;document.querySelectorAll('[data-exp]').forEach(b=>b.hidden=!s);return s}).catch(()=>null):Promise.resolve(null);
const EXPL=LS.get('expl',{});
function explainBlock(q,a){
  const k=q.i+'|'+(a||'');const prev=EXPL[k];
  return `<div class="expwrap" data-q="${q.i}" data-a="${esc(a||'')}">${prev?`<div class="explain">${fmtExpl(prev)}</div>`:`<div><button class="btn small" data-exp ${sampler?'':'hidden'}>Explain this with Claude</button></div><div class="explain" hidden></div>`}</div>`;
}
function fmtExpl(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#+\s*(.+)$/gm,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function bindExplain(){
  document.querySelectorAll('[data-exp]').forEach(b=>{b.hidden=!sampler;b.onclick=()=>explain(b)});
}
async function explain(btn){
  const w=btn.closest('.expwrap'); const q=QM[w.dataset.q]; const a=w.dataset.a; const out=w.querySelector('.explain');
  const s=sampler||await sampleP; if(!s){toast('Claude is not available in this view');return}
  btn.disabled=true; btn.textContent='Asking Claude…'; out.hidden=false; out.textContent='Thinking…';
  try{
    const blob=await getBlob(q.i);
    const P=PM[q.p]; const c=check(q,a);
    const prompt=`You are an expert GATE CSE tutor. The attached image is ${q.l} from the official GATE ${P.y}${P.s?' (Set '+P.s+')':''} Computer Science paper (organised by ${P.iit}). Subject: ${SUB[q.s]}. Question type: ${q.t} (${q.t==='MCQ'?'single correct option':q.t==='MSQ'?'one or more correct options':'numerical answer'}), ${q.m} mark(s).
Official answer key: ${keyText(q)}.
Student's answer: ${respText(q,a)} → ${c.st==='c'?'correct':c.st==='w'?'incorrect':'not attempted'}.

Write a clear solution for this student:
1. Restate in one line what the question asks.
2. Solve it step by step and arrive at the official answer.
${c.st==='w'?'3. Explain exactly why the student\'s answer is wrong and the likely misconception behind it.\n4.':'3.'} ${q.t!=='NAT'?'Briefly say why each other option is right or wrong.':'Give a quick sanity check of the number.'}
${c.st==='w'?'5.':'4.'} End with one line: "Key idea:" and the concept to remember.
Use plain text, short paragraphs, **bold** for headings, and simple inline math. Stay under 400 words. If the image is unclear, say which part you could not read rather than guessing.`;
    const r=await s(prompt,{images:[blob],modelTier:'default',onText:({text})=>{out.innerHTML=fmtExpl(text)}});
    out.innerHTML=fmtExpl(r.text); EXPL[q.i+'|'+(a||'')]=r.text; const keys=Object.keys(EXPL); if(keys.length>120)delete EXPL[keys[0]]; LS.set('expl',EXPL); btn.remove();
  }catch(e){
    out.textContent=e&&e.code==='rate_limited'?'Too many requests just now. Wait a minute, then try again.':e&&e.code==='not_granted'?'Explanations need permission to ask Claude. Allow it from this page’s permissions to use them.':'Could not get an explanation: '+(e&&e.message||'unknown error');
    btn.disabled=false; btn.textContent='Try again';
  }
}

/* ---------- weightage ---------- */
function viewWeight(){
  const years=[...new Set(D.papers.map(p=>p.y))].sort();
  const subs=SUBORD.filter(s=>s!=='GA');
  const M={}; // M[s][y] avg marks per paper
  years.forEach(y=>{const ps=D.papers.filter(p=>p.y===y);subs.forEach(s=>{const tot=D.q.filter(q=>q.s===s&&PM[q.p].y===y).reduce((a,q)=>a+q.m,0);(M[s]=M[s]||{})[y]=tot/ps.length})});
  const avg=s=>years.reduce((a,y)=>a+M[s][y],0)/years.length;
  const recent=years.filter(y=>y>=2021); const ravg=s=>recent.reduce((a,y)=>a+M[s][y],0)/recent.length;
  const mx=Math.max(...subs.map(s=>Math.max(...years.map(y=>M[s][y]))));
  const order=subs.filter(s=>s!=='OT').sort((a,b)=>ravg(b)-ravg(a));
  const mr=Math.max(...order.map(ravg));
  const cellBg=v=>{const t=v/mx;return `background:rgba(29,78,163,${(t*0.38).toFixed(3)});color:var(--ink)`};
  return `<section style="display:grid;gap:6px"><div class="eyebrow">Subject weightage</div><h1 style="font-size:clamp(28px,4vw,40px);line-height:1.1">Where the 85 subject marks went, year by year.</h1>
    <p class="lead">Marks per subject in each official paper, averaged across sets in years with two or three sets. Computed from the questions on this site, each tagged to one subject. General Aptitude is a fixed 15 marks every year.</p></section>
  <section class="panel" style="display:grid;gap:12px"><h2 style="font-size:22px">Average marks, 2021–2026</h2>
    <div style="display:grid;gap:8px">${order.map(s=>`<div class="hbar"><span>${SUB[s]}</span><div class="t" style="width:${100*ravg(s)/mr}%"></div><span class="num" style="text-align:right">${ravg(s).toFixed(1)}</span></div>`).join('')}</div>
    <p class="muted" style="font-size:12.5px;margin:0">Engineering Maths and Discrete Maths together average ${(ravg('EM')+ravg('DM')).toFixed(1)} marks in recent papers.</p></section>
  <section class="panel" style="display:grid;gap:12px"><h2 style="font-size:22px">Marks per subject by year</h2>
    <div class="scroll"><table class="tbl heat"><thead><tr><th>Subject</th>${years.map(y=>`<th class="n" style="text-align:center">${y}</th>`).join('')}<th class="n">Avg</th></tr></thead><tbody>
    ${subs.map(s=>`<tr><td style="white-space:nowrap">${SUB[s]}</td>${years.map(y=>`<td class="c" style="${cellBg(M[s][y])}">${M[s][y]?String(Math.round(M[s][y]*10)/10):'–'}</td>`).join('')}<td class="n">${avg(s).toFixed(1)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="muted" style="font-size:12.5px;margin:0">“Old syllabus” covers topics removed from the current GATE CSE syllabus (for example cryptography and software engineering questions in older papers).</p></section>`;
}

/* ---------- history ---------- */
function viewHistory(){
  const h=LS.get('hist',[]);
  return `<section style="display:grid;gap:6px"><div class="eyebrow">Your attempts</div><h1 style="font-size:clamp(28px,4vw,40px)">History</h1><p class="lead">Saved in this browser only. Open any attempt for its full analysis and question review.</p></section>
  ${h.length?`<div class="panel scroll" style="padding:6px 10px"><table class="tbl"><thead><tr><th>Date</th><th>Test</th><th class="n">Marks</th><th class="n">Correct</th><th class="n">Wrong</th><th class="n">Time</th><th></th></tr></thead><tbody>
  ${h.map((r,i)=>`<tr><td class="num" style="white-space:nowrap">${new Date(r.date).toLocaleDateString()}</td><td>${esc(r.title)}</td><td class="n">${fmtM(r.score)} / ${r.max}</td><td class="n">${r.c}</td><td class="n">${r.w}</td><td class="n">${fmtT(r.elapsed)}</td><td><button class="btn small" data-h="${i}">Open</button></td></tr>`).join('')}
  </tbody></table></div><div><button class="btn ghost" id="hclear">Clear history</button></div>`:`<div class="panel empty">No attempts yet. Start a year paper or a mixed mock, and your results will be listed here.</div>`}`;
}
function bindHistory(){
  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{resultCtx={rec:LS.get('hist',[])[+b.dataset.h],filter:'wrong'};go('result')});
  const c=$('#hclear'); if(c) c.onclick=()=>sheet(`<h3 style="font-size:20px">Clear all attempts?</h3><p class="muted" style="margin:0">This removes every saved result from this browser.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Clear history</button></div>`,()=>{LS.set('hist',[]);render()});
}

/* ---------- image packs ---------- */
const PACK={},BLOB={},URLS={};
function loadPack(p){return PACK[p]||(PACK[p]=fetch('pack/'+p+'.json').then(r=>{if(!r.ok)throw new Error('pack '+p);return r.json()}).catch(e=>{delete PACK[p];throw e}))}
async function getBlob(id){if(BLOB[id])return BLOB[id];const d=await loadPack(id.split('_')[0]);const bin=atob(d[id]);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return BLOB[id]=new Blob([u],{type:'image/png'})}
async function imgURL(id){return URLS[id]||(URLS[id]=URL.createObjectURL(await getBlob(id)))}
function hydrate(){document.querySelectorAll('.qimg img').forEach(im=>im.onclick=()=>im.classList.toggle('zoom'));document.querySelectorAll('img[data-q]:not([src])').forEach(im=>{imgURL(im.dataset.q).then(u=>im.src=u).catch(()=>{im.alt='Image failed to load. Check your connection and reopen this question.'})})}
function prefetch(){if(view==='exam'&&ex){const n=ex.qs[ex.cur+1];if(n)loadPack(n.split('_')[0]).catch(()=>{})}}
/* ---------- render ---------- */
function render(keepScroll){
  const y=window.scrollY;
  const app=$('#app');
  setNav();
  if(view==='exam'&&!ex){view='papers'}
  if(view==='result'&&!resultCtx){view='history'}
  const V={papers:[viewPapers,bindPapers],mixed:[viewMixed,bindMixed],practice:[viewPractice,bindPractice],weight:[viewWeight,()=>{}],history:[viewHistory,bindHistory],exam:[viewExam,bindExam],result:[viewResult,bindResult]}[view];
  app.innerHTML=`<div class="view">${V[0]()}</div>`; V[1](); hydrate(); prefetch();
  if(keepScroll)window.scrollTo(0,y);
}
render();
</script>
